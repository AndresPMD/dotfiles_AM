# set -g prefix ^B

unbind r
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set -g prefix ^s

set -g mouse on
set-option -g status-position bottom
set -g history-limit 50000

unbind-key h
unbind-key j
unbind-key k
unbind-key l

# Override vim-tmux-navigator bindings with no-op
unbind-key C-h
unbind-key C-j
unbind-key C-k
unbind-key C-l
bind C-h send-keys "noop"
bind C-j send-keys "noop"
bind C-k send-keys "noop"
bind C-l send-keys "noop"

# ALLOW Ctrl+K delete end line
bind-key -n C-k send-keys C-k

bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R

# Disable vim-tmux-navigator bindings
set -g @vim-tmux-navigator-no-mappings 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# Removed tmux-sensible — it overrides automatic-rename settings
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'
#set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Catppuccin theme settings
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "none"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"

# Pane borders disabled (was showing folder path at top)
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_status "off"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Override catppuccin module text to use shell scripts directly
# (#{cpu_percentage} from tmux-cpu only works via string interpolation at plugin load)
set -g @catppuccin_cpu_text " #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"
set -g @catppuccin_load_text " #(uptime | awk -F'load average: ' '{print $2}' | cut -d, -f1)"
set -g @catppuccin_load_icon "LOAD "

# Prevent tmux from renaming windows based on running command
set -g allow-rename off
set -g automatic-rename off
set-window-option -g automatic-rename off
set -g set-titles off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Assemble catppuccin status bar from modules (after TPM so catppuccin variables exist)
# Note: no "memory" module in catppuccin — RAM shown inline instead
set -g status-right-length 200
set -g status-right "CPU:#(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) RAM:#(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) GPU:#(~/.local/bin/tmux-gpu.sh)%% VRAM:#(~/.local/bin/tmux-vram.sh)%% #{E:@catppuccin_status_load}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_session}"
set -g status-left ""

# Re-apply after TPM loads (tmux-sensible may override)
set -g allow-rename off
set -g automatic-rename off
set-window-option -g automatic-rename off

# Force disable auto-rename on every new window and window switch
set-hook -g after-new-window 'set-window-option automatic-rename off'
set-hook -g after-select-window 'set-window-option automatic-rename off'
set-hook -g after-new-session 'set-window-option automatic-rename off'
